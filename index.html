<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Log</title>
<meta name="description" content="내가 본 영화 기록">
<script>
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* 저장소 차단 시 시스템 설정 */ }
</script>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f4f3ef; --fg: #121211; --sub: #8a8882; --line: #121211; --soft: #d9d7d1; --card: #e6e4de;
    /* 묶음 색 7종(라이트): cmux 사이드바 색의 Kanagawa Lotus 대응값. 순서 = Orange, Pink, Violet, Blue, Aqua, Green, Yellow */
    --c0: #cc6d00; --c1: #b35b79; --c2: #624c83; --c3: #4d699b; --c4: #597b75; --c5: #6f894e; --c6: #8a7a2e;
    --display: "Archivo", "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --body: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    color-scheme: light;
    --accent: #d42b14; /* 포인트 색(빨강). 선택 표시, INDEX 호버 제목, 링크 밑줄, 텍스트 선택에만 사용 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1f1f28; --fg: #eeede8; --sub: #7f7e88; --line: #eeede8; --soft: #363646; --card: #2a2a37; --accent: #ff4b33; --c0: #ffa066; --c1: #d27e99; --c2: #957fb8; --c3: #658594; --c4: #6a9589; --c5: #76946a; --c6: #c0a36e; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1f1f28; --fg: #eeede8; --sub: #7f7e88; --line: #eeede8; --soft: #363646; --card: #2a2a37; --accent: #ff4b33; --c0: #ffa066; --c1: #d27e99; --c2: #957fb8; --c3: #658594; --c4: #6a9589; --c5: #76946a; --c6: #c0a36e; color-scheme: dark; }
  body { transition: background-color .25s, color .25s; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--fg); font: 14px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: var(--bg); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 72px; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

  /* 헤더 */
  header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; padding-bottom: 14px; border-bottom: 2px solid var(--line); }
  h1 { margin: 0; font-family: var(--display); font-stretch: 62%; font-weight: 900; text-transform: uppercase;
    font-size: clamp(38px, 8vw, 112px); line-height: .82; letter-spacing: -.01em; }
  .stats { text-align: right; display: grid; gap: 2px; padding-bottom: 6px; }
  .stats b { font-family: var(--display); font-stretch: 75%; font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stats div + div { margin-top: 10px; }
  .stats .mono { color: var(--sub); display: block; margin-top: 3px; }
  header { position: relative; }
  .util { position: absolute; top: 2px; right: 0; display: flex; gap: 18px; }
  .util a, .util button { color: var(--sub); text-decoration: none; background: none; border: 0; padding: 2px 0; cursor: pointer; }
  .util a:hover, .util button:hover { color: var(--accent); }

  /* 컨트롤 */
  .controls { display: flex; gap: 14px 40px; align-items: flex-start; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--soft); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .years { display: flex; flex-wrap: wrap; gap: 2px 14px; flex: 1; min-width: 0; }
  .chip { background: none; border: 0; padding: 4px 0; color: var(--sub); cursor: pointer; font-family: var(--mono);
    font-size: 12px; letter-spacing: .04em; position: relative; }
  .years .chip { text-transform: none; }
  .chip .cnt { opacity: .6; }
  .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--g); margin-right: 5px; vertical-align: 1px; }
  .chip[style][aria-pressed="true"]::before { color: var(--g); }
  .chip:hover { color: var(--fg); }
  .chip[aria-pressed="true"] { color: var(--fg); }
  .chip[aria-pressed="true"]::before { content: "▸"; position: absolute; left: -11px; color: var(--accent); }
  .right { display: flex; gap: 24px; align-items: center; flex: none; }
  .sort { display: flex; gap: 14px; }
  input[type=search] { background: none; border: 0; border-bottom: 1px solid var(--soft); color: var(--fg); padding: 4px 0;
    font: 13px var(--body); width: 220px; border-radius: 0; }
  input[type=search]::placeholder { color: var(--sub); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  input[type=search]:focus { outline: none; border-color: var(--fg); }

  /* 목록 */
  .group { margin-top: 48px; }
  .group-head { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 20px; }
  .group-head h2 { margin: 0; font-family: var(--display); font-stretch: 62%; font-weight: 800; font-size: 56px; line-height: .85; }
  .group-head .mono { color: var(--sub); }
  .group[style] .group-head h2 { color: var(--g); }
  .group[style] .group-head { border-bottom-color: var(--g); }
  .flat { margin-top: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 36px 20px; align-items: start; }
  .card { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; display: flex; flex-direction: column; justify-content: flex-start; width: 100%; min-width: 0; }
  .card .no { display: flex; justify-content: space-between; color: var(--sub); margin-bottom: 6px; }
  .poster { aspect-ratio: 2 / 3; background: var(--card); overflow: hidden; position: relative; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .35s ease, transform .5s ease; }
  .poster .ph { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 10px; font-family: var(--display);
    font-stretch: 62%; font-weight: 800; font-size: 26px; line-height: .95; text-transform: uppercase; word-break: keep-all; }
  @media (hover: hover) {
    .poster img { filter: grayscale(1) contrast(1.05); }
    .card:hover .poster img, .card:focus-visible .poster img { filter: none; transform: scale(1.02); }
  }
  .card:focus-visible { outline: 1px solid var(--g, var(--fg)); outline-offset: 4px; }
  @media (hover: hover) { .card .t { transition: color .15s; } .card:hover .t { color: var(--g, var(--fg)); } }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 1px solid var(--g, var(--accent)); outline-offset: 3px; }
  .card .t { margin-top: 10px; font-weight: 700; font-size: 14px; line-height: 1.35; word-break: keep-all; }
  .card .o { color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .card .meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card .meta span:last-child { color: var(--sub); flex: none; }
  .empty { color: var(--sub); padding: 64px 0; }

  /* INDEX 보기: 포스터 없이 원제 리스트, 마우스를 올리면 포스터가 커서 옆에 뜬다 */
  .rows { display: block; }
  .row { display: grid; grid-template-columns: 62px minmax(0, 1fr) 200px 52px 64px; gap: 16px; align-items: baseline; width: 100%;
    background: none; border: 0; border-bottom: 1px solid var(--soft); padding: 9px 0 7px; text-align: left; color: inherit; font: inherit; cursor: pointer;
    transition: opacity .2s; }
  .row .mono { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .num { text-align: right; }
  .row .ttl { min-width: 0; display: flex; align-items: baseline; gap: 12px; }
  .row .ttl b { font-family: var(--display); font-stretch: 62%; font-weight: 800; font-size: clamp(24px, 2.9vw, 38px); line-height: 1.02;
    text-transform: uppercase; letter-spacing: -.005em; word-break: keep-all; transition: color .15s; }
  .row .ttl .mono { flex: none; max-width: 40%; }
  #list.hovering .row:not(.on) { opacity: .28; }
  .row.on .ttl b { color: var(--g, var(--accent)); }
  .row:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
  #peek { position: fixed; z-index: 20; width: 210px; aspect-ratio: 2 / 3; pointer-events: none; opacity: 0; transition: opacity .15s;
    background: var(--card); box-shadow: 0 18px 50px rgba(0,0,0,.45); left: 0; top: 0; }
  #peek.show { opacity: 1; }
  #peek img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .view { display: flex; gap: 14px; }



  /* 상세 */
  dialog { border: 1px solid var(--line); padding: 0; background: var(--bg); color: var(--fg); max-width: 820px; width: calc(100% - 32px); max-height: calc(100% - 32px); }
  dialog::backdrop { background: rgba(10,10,10,.7); backdrop-filter: blur(2px); }
  .dlg { display: grid; grid-template-columns: 240px 1fr; gap: 28px; padding: 28px; }
  .dlg img { width: 100%; display: block; }
  .dlg .no { color: var(--g, var(--sub)); margin-bottom: 10px; }
  dialog { border-color: var(--g, var(--line)); }
  .dlg h3 { margin: 0; font-size: 26px; line-height: 1.25; word-break: keep-all; }
  .dlg .orig { color: var(--sub); margin: 6px 0 20px; }
  .dlg dl { display: grid; grid-template-columns: 88px 1fr; margin: 0 0 20px; border-top: 1px solid var(--soft); }
  .dlg dt, .dlg dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--soft); }
  .dlg dt { color: var(--sub); }
  .dlg dd { font-size: 13px; }
  .dlg p { margin: 0 0 22px; font-size: 13px; line-height: 1.75; }
  .links { display: flex; gap: 18px; }
  .links a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--g, var(--accent)); padding-bottom: 1px; }
  .links a:hover { color: var(--g, var(--accent)); }
  .close { position: absolute; top: 10px; right: 14px; background: none; border: 0; color: var(--fg); cursor: pointer; }

  footer { margin-top: 96px; padding-top: 14px; border-top: 2px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--sub); }
  footer a { color: var(--fg); }
  footer .tmdb img { display: block; height: 12px; width: auto; margin-bottom: 8px; }
  footer .tmdb { max-width: 520px; }

  @media (max-width: 640px) {
    .wrap { padding: 20px 16px 56px; }
    header { grid-template-columns: 1fr; gap: 14px; }
    .stats { text-align: left; grid-auto-flow: column; justify-content: start; gap: 28px; }
    .stats div + div { margin-top: 0; }
    .controls { flex-wrap: wrap; }
    .years { flex: none; width: 100%; }
    .right { order: -1; width: 100%; justify-content: space-between; gap: 16px; }
    input[type=search] { width: 100%; flex: 1; }
    .years, .sort { padding-left: 11px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 10px; }
    .card .mono { font-size: 9.5px; letter-spacing: .02em; }
    .card .t { font-size: 12px; margin-top: 8px; }
    .card .meta { margin-top: 4px; }
    .group-head h2 { font-size: 44px; }
    .row { grid-template-columns: minmax(0, 1fr) 40px; gap: 10px; padding: 8px 0 6px; }
    .row > .c-no, .row > .c-dir, .row > .c-seen { display: none; }
    .row .ttl { flex-direction: column; gap: 1px; }
    .row .ttl b { font-size: 22px; }
    .row .ttl .mono { max-width: 100%; font-size: 9.5px; }
    .right { flex-wrap: wrap; }
    .dlg { grid-template-columns: 1fr; padding: 20px; gap: 18px; }
    .dlg img { width: 150px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Movie<br>Log</h1>
    <nav class="util">
      <a class="mono" href="https://www.instagram.com/cleanseyourkarma/" target="_blank" rel="noopener" title="Instagram @cleanseyourkarma">Seen by ↗</a>
      <button class="mono" id="theme" type="button"></button>
    </nav>
    <div class="stats">
      <div><b id="sTotal">-</b><span class="mono" id="sLabel">Films seen</span></div>
    </div>
  </header>

  <div class="controls">
    <div class="years" id="years" role="group" aria-label="관람연도"></div>
    <div class="right">
      <div class="view" role="group" aria-label="보기">
        <button class="chip" data-view="grid" aria-pressed="true">GRID</button>
        <button class="chip" data-view="index" aria-pressed="false">INDEX</button>
      </div>
      <div class="sort" role="group" aria-label="정렬">
        <button class="chip" data-sort="watched" aria-pressed="true">SEEN</button>
        <button class="chip" data-sort="release" aria-pressed="false">RELEASED</button>
      </div>
      <input type="search" id="q" placeholder="Search title, director" aria-label="제목, 원제, 감독 검색">
    </div>
  </div>
  <main id="list"></main>

  <footer class="mono">
    <span id="updated"></span>
    <span class="tmdb"><a href="https://www.themoviedb.org/" target="_blank" rel="noopener"><img src="tmdb.svg" alt="TMDB" width="120" height="16"></a>
    Data &amp; posters: TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
  </footer>
</div>

<div id="peek" aria-hidden="true"></div>
<dialog id="dlg"><button class="close mono" aria-label="닫기">Close ✕</button><div id="dlgBody"></div></dialog>

<script>
// 상태와 유틸
const IMG = "https://image.tmdb.org/t/p/";
const DECADE_BEFORE = 2010; // 이 해부터는 연도별, 그 전은 연대별 묶음
// 묶음 키: 관람순은 관람연도, 개봉순은 2010년 이후 연도와 그 전 연대
const groupKey = (m) => state.sort === "watched"
  ? String(m.wy || "Unknown")
  : !m.ry ? "Unknown" : m.ry >= DECADE_BEFORE ? String(m.ry) : `${Math.floor(m.ry / 10) * 10}s`;
const state = { year: "all", sort: "watched", q: "", view: "grid" };
let movies = [];
const groupColor = new Map(); // 묶음 키 → 색 번호(0-6)
const gStyle = (k) => groupColor.has(k) ? ` style="--g: var(--c${groupColor.get(k)})"` : "";
let regionName = (c) => c;
try { const dn = new Intl.DisplayNames(["ko"], { type: "region" }); regionName = (c) => dn.of(c) || c; } catch (e) { /* 미지원 브라우저는 국가 코드 그대로 */ }

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s ?? "").toLowerCase().replace(/\s+/g, "");
const seen = (m) => !m.wy ? "Unknown" : m.wm ? `${m.wy}.${String(m.wm).padStart(2, "0")}` : `${m.wy}`;
const no = (n) => `No.${String(n).padStart(3, "0")}`;

function filtered() {
  const q = norm(state.q);
  let list = state.sort === "release" ? [...movies].sort((a, b) => (b.ry || 0) - (a.ry || 0) || b.n - a.n) : movies;
  list = list.filter((m) => state.year === "all" || groupKey(m) === state.year);
  if (q) list = list.filter((m) => norm(m.t).includes(q) || norm(m.o).includes(q) || (m.dir || []).some((d) => norm(d).includes(q)));
  return list;
}

function cardHtml(m) {
  const poster = m.p
    ? `<img src="${IMG}w342${m.p}" alt="" loading="lazy" decoding="async">`
    : `<div class="ph">${esc(m.o || m.t)}</div>`;
  return `<button class="card" data-n="${m.n}" aria-label="${esc(m.t)} 상세 보기">
    <div class="no mono"><span>${no(m.n)}</span><span>${esc(seen(m))}</span></div>
    <div class="poster">${poster}</div>
    <div class="t">${esc(m.o || m.t)}</div>
    ${m.o ? `<div class="o mono">${esc(m.t)}</div>` : ""}
    <div class="meta mono"><span>${esc((m.dir || [])[0] || "")}</span><span>${esc(m.ry || "")}</span></div>
  </button>`;
}

function rowHtml(m) {
  return `<button class="row" data-n="${m.n}" aria-label="${esc(m.t)} 상세 보기">
    <span class="mono c-no">${no(m.n)}</span>
    <span class="ttl"><b>${esc(m.o || m.t)}</b>${m.o ? `<span class="mono">${esc(m.t)}</span>` : ""}</span>
    <span class="mono c-dir">${esc((m.dir || [])[0] || "")}</span>
    <span class="mono num c-year">${esc(m.ry || "")}</span>
    <span class="mono num c-seen">${esc(seen(m))}</span>
  </button>`;
}

function render() {
  const item = state.view === "index" ? rowHtml : cardHtml;
  const box = state.view === "index" ? "rows" : "grid";
  const list = filtered();
  const el = document.getElementById("list");
  if (!list.length) { el.innerHTML = `<p class="empty mono">No films found.</p>`; return; }
  // 검색 중에는 한 덩어리. 관람순은 관람연도별, 개봉순은 2010년 이후 연도별과 2009년 이전 연대별로 묶는다
  if (state.q) {
    el.innerHTML = `<section class="group"><div class="group-head"><h2>Search</h2><span class="mono">${list.length} Films</span></div>
      <div class="${box}">${list.map(item).join("")}</div></section>`;
    return;
  }
  const groups = new Map();
  list.forEach((m) => { const k = groupKey(m); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(m); });
  el.innerHTML = [...groups].map(([y, ms]) =>
    `<section class="group"${gStyle(y)}><div class="group-head"><h2>${esc(y)}</h2><span class="mono">${ms.length} Films</span></div>
     <div class="${box}">${ms.map(item).join("")}</div></section>`).join("");
}

function openDetail(m) {
  const rows = [
    ["Release", m.ry], ["Director", (m.dir || []).join(", ")], ["Genre", (m.g || []).join(", ")],
    ["Runtime", m.rt ? `${m.rt}분` : ""], ["Country", (m.c || []).map(regionName).join(", ")], ["Seen", seen(m)],
  ].filter(([, v]) => v);
  const links = [
    m.tm && `<a class="mono" href="https://www.themoviedb.org/movie/${m.tm}" target="_blank" rel="noopener">TMDB ↗</a>`,
    m.im && `<a class="mono" href="https://www.imdb.com/title/${m.im}/" target="_blank" rel="noopener">IMDb ↗</a>`,
  ].filter(Boolean).join("");
  document.getElementById("dlgBody").innerHTML = `<div class="dlg">
    <div>${m.p ? `<img src="${IMG}w500${m.p}" alt="${esc(m.t)} 포스터">` : ""}</div>
    <div>
      <div class="no mono">${no(m.n)}</div>
      <h3>${esc(m.o || m.t)}</h3>
      ${m.o ? `<div class="orig mono">${esc(m.t)}</div>` : `<div class="orig"></div>`}
      <dl>${rows.map(([k, v]) => `<dt class="mono">${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${m.ov ? `<p>${esc(m.ov)}</p>` : ""}
      <div class="links">${links}</div>
    </div></div>`;
  const dg = document.getElementById("dlg"), gk = groupKey(m);
  if (groupColor.has(gk)) dg.style.setProperty("--g", `var(--c${groupColor.get(gk)})`); else dg.style.removeProperty("--g");
  dg.showModal();
}

function setupControls() {
  const yEl = document.getElementById("years");
  // 네비게이션: 현재 정렬의 묶음과 편수. 정렬이 바뀌면 다시 그리고 ALL로 되돌린다
  const buildNav = () => {
    state.year = "all";
    const counts = new Map();
    filtered().forEach((m) => { const k = groupKey(m); counts.set(k, (counts.get(k) || 0) + 1); });
    yEl.setAttribute("aria-label", state.sort === "watched" ? "관람연도" : "개봉연도");
    groupColor.clear(); [...counts.keys()].forEach((k, i) => groupColor.set(k, i % 7));
    yEl.innerHTML = [`<button class="chip" data-year="all" aria-pressed="true">ALL</button>`,
      ...[...counts].map(([k, c]) => `<button class="chip" data-year="${esc(k)}" aria-pressed="false"${gStyle(k)}><i class="dot"></i>${esc(k)}<span class="cnt">(${c})</span></button>`)].join("");
  };
  { const q0 = state.q; state.q = ""; buildNav(); state.q = q0; }
  yEl.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.year = b.dataset.year;
    yEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  });
  document.querySelector(".sort").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.sort = b.dataset.sort;
    document.querySelectorAll(".sort button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    { const q0 = state.q; state.q = ""; buildNav(); state.q = q0; }
    render();
  });
  document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  const byN = new Map(movies.map((m) => [m.n, m]));
  document.getElementById("list").addEventListener("click", (e) => {
    const c = e.target.closest(".card, .row"); if (c) openDetail(byN.get(+c.dataset.n));
  });
  // 보기 전환
  document.querySelector(".view").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.view = b.dataset.view;
    document.querySelectorAll(".view button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    hidePeek(); render();
  });
  // INDEX 보기: 행에 마우스를 올리면 포스터가 커서를 따라온다(터치 기기 제외)
  const listEl = document.getElementById("list"), peek = document.getElementById("peek");
  let onRow = null;
  function hidePeek() { peek.classList.remove("show"); listEl.classList.remove("hovering"); if (onRow) onRow.classList.remove("on"); onRow = null; }
  const place = (x, y) => {
    const w = peek.offsetWidth, h = peek.offsetHeight;
    const left = x + 28 + w > window.innerWidth ? x - 28 - w : x + 28;
    const top = Math.max(12, Math.min(y - h / 2, window.innerHeight - h - 12));
    peek.style.transform = `translate(${left}px, ${top}px)`;
  };
  const showRow = (r, x, y) => {
    if (r !== onRow) {
      if (onRow) onRow.classList.remove("on");
      onRow = r; r.classList.add("on"); listEl.classList.add("hovering");
      const m = byN.get(+r.dataset.n);
      peek.innerHTML = m.p ? `<img src="${IMG}w342${m.p}" alt="">` : "";
      peek.classList.toggle("show", !!m.p);
    }
    place(x, y);
  };
  if (window.matchMedia("(hover: hover)").matches) {
    listEl.addEventListener("mousemove", (e) => { const r = e.target.closest(".row"); if (r) showRow(r, e.clientX, e.clientY); else hidePeek(); });
    listEl.addEventListener("mouseleave", hidePeek);
    window.addEventListener("scroll", hidePeek, { passive: true });
  }
  // 첫 화면: 모바일(640px 이하)은 GRID, PC는 방문할 때마다 GRID와 INDEX 중 무작위
  if (!window.matchMedia("(max-width: 640px)").matches && Math.random() < 0.5) {
    state.view = "index";
    document.querySelectorAll(".view button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.view === "index"));
  }
  const d = document.getElementById("dlg");
  d.querySelector(".close").addEventListener("click", () => d.close());
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); });

  document.getElementById("sTotal").textContent = movies.length;
  const firstYear = Math.min(...movies.map((m) => m.wy).filter(Boolean));
  if (Number.isFinite(firstYear)) document.getElementById("sLabel").textContent = `Films seen since ${firstYear}`;
}

// 테마 전환: 저장값이 없으면 시스템 설정을 따른다
(function setupTheme() {
  const btn = document.getElementById("theme");
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const current = () => document.documentElement.dataset.theme || (mq.matches ? "dark" : "light");
  const paint = () => {
    const next = current() === "dark" ? "light" : "dark";
    btn.textContent = next === "light" ? "Light ◑" : "Dark ◐";
    btn.setAttribute("aria-label", next === "light" ? "라이트 모드로 전환" : "다크 모드로 전환");
  };
  btn.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) { /* 저장 실패해도 이번 방문엔 적용 */ }
    paint();
  });
  mq.addEventListener?.("change", paint);
  paint();
})();

fetch("movies.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    movies = data.movies || [];
    document.getElementById("updated").textContent = `Updated ${data.updated}`;
    setupControls();
    render();
  })
  .catch((err) => {
    document.getElementById("list").innerHTML = `<p class="empty mono">Failed to load (${esc(err.message)}).</p>`;
  });
</script>
